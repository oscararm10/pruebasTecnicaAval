AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aval - Flujo de aprobaciones con firma digital concatenada

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref AvalTable
        BUCKET_NAME: !Ref EvidenciasBucket
        APP_BASE_URL: !Ref AppBaseUrl
        LOCAL_MODE: 'false'

Parameters:
  AppBaseUrl:
    Type: String
    Default: https://example.com
    Description: URL del frontend para armar links de aprobación

Resources:
  AvalApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - application/pdf

  AvalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/router.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AvalTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenciasBucket
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref AvalApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref AvalApi
            Path: /
            Method: ANY

  AvalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EvidenciasBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub 'https://${AvalApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  TableName:
    Value: !Ref AvalTable
  BucketName:
    Value: !Ref EvidenciasBucket
